apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: Pod
metadata:
  name: api-oom
  namespace: demo
spec:
  containers:
    - name: stress
      image: polinux/stress
      command: ["stress"]
      args: ["--vm", "1", "--vm-bytes", "100M", "--vm-hang", "1"]
      resources:
        limits:
          memory: "50Mi"
---
apiVersion: v1
kind: Pod
metadata:
  name: worker-crash
  namespace: demo
spec:
  containers:
    - name: busybox
      image: busybox
      command: ["sh", "-c", "echo démarrage; exit 1"]
---
apiVersion: v1
kind: Pod
metadata:
  name: worker-pending
  namespace: demo
spec:
  containers:
    - name: nginx
      image: nginx
      resources:
        requests:
          cpu: "100"

